name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: docker://rhysd/actionlint:1.7.7
      - run: uv sync --all-groups --locked
      - run: uv run coverage run -m pytest
      - run: uv run coverage report --show-missing --fail-under=100
      - run: uv run coverage json -o coverage.json
      - run: uv run python tools/check_function_coverage.py coverage.json src/skillroll tools
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --strict src tools

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --locked
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups --locked
      - run: uv build
      - run: uv run pytest -q tests/test_package_e2e.py
