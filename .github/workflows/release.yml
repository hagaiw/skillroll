name: Release
run-name: >-
  ${{ inputs.candidate_run != '' &&
      format('Publish {0} (prepare #{1})', inputs.version, inputs.candidate_run) ||
      github.workflow }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Preparation run ID (set automatically by Release new version)
        type: string
        required: false
      publish:
        description: Publish the prepared version (otherwise rehearse only)
        type: boolean
        default: false
      version:
        description: Confirm the prepared version, without v (required to publish)
        type: string
        required: false

# Serialize publication without cancelling a release already in progress.
concurrency:
  group: >-
    skillroll-release-${{
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
      && 'publish' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and rehearse
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.evidence.outputs.publishable }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      tag: ${{ steps.candidate.outputs.tag }}
      commit: ${{ steps.candidate.outputs.commit }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # astral-sh/setup-uv v10.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - id: candidate
        name: Check release candidate identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          SELECTED_REF: ${{ github.ref }}
          REQUESTED_VERSION: ${{ inputs.version }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          uv run python - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path
          from skillroll.release import release_metadata, validate_release_files

          metadata = release_metadata()
          report = validate_release_files(Path('.'))
          assert report.is_valid, report.problems
          if os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ['PUBLISH'] == 'true':
              if os.environ.get('CANDIDATE_RUN'):
                  assert os.environ['SELECTED_REF'] == f'refs/tags/{metadata.tag}', 'Prepared publication requires its exact tag'
              else:
                  assert os.environ['SELECTED_REF'] == 'refs/heads/main', 'Publish from main only'
              assert os.environ['REQUESTED_VERSION'] == metadata.version, 'Confirm the canonical version'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tag = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{metadata.tag}^{{commit}}'], capture_output=True, text=True)
          if os.environ['PUBLISH'] == 'true':
              assert tag.returncode != 0 or tag.stdout.strip() == commit, 'Release tag already points at another commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={metadata.tag}\ncommit={commit}\nprerelease={str(metadata.prerelease).lower()}\n')
          PYTHON
      - if: inputs.candidate_run == ''
        run: uv run pytest -q
      # Token-created releases do not trigger other workflows: validate here too.
      - name: Validate eval structure without repository commands
        shell: bash
        run: |
          status=0
          uv run skillroll validate --all || status="$?"
          # INCOMPLETE (2) is expected when declared commands are not run.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
      - name: Verify the published tag matches the canonical version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run python -c "import os; from skillroll.release import
          release_metadata; assert os.environ['RELEASE_TAG'] ==
          release_metadata().tag"
      - if: inputs.candidate_run == ''
        run: uv build --out-dir dist
      - name: Verify preparation run origin
        if: inputs.candidate_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        shell: bash
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN" > preparation-run.json
          python - <<'PY'
          import json, os
          value = json.load(open('preparation-run.json'))
          assert value['path'] == '.github/workflows/new-release.yml'
          assert value['head_repository']['full_name'] == os.environ['GH_REPO']
          assert value['event'] in {'workflow_dispatch', 'pull_request'}
          PY
          gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN/jobs" > preparation-jobs.json
          python - <<'PY'
          import json
          jobs = json.load(open('preparation-jobs.json'))['jobs']
          assert all(any(job['name'] == name and job['conclusion'] == 'success' for job in jobs)
              for name in ['prepare', 'gates'])
          PY
      # actions/download-artifact v8.0.1
      - if: inputs.candidate_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Bind prepared artifacts to this tagged revision
        if: inputs.candidate_run != ''
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: >-
          uv run python tools/verify_prepared_release.py --root .
          --artifacts dist --evidence release-evidence
          --commit "$GITHUB_SHA" --run-id "$CANDIDATE_RUN"
      - name: Verify wheel metadata before privileged handoff
        run: >-
          uv run python -c "from pathlib import Path; import zipfile;
          from skillroll import __version__; wheel = next(Path('dist').glob('*.whl'));
          archive = zipfile.ZipFile(wheel); metadata = next(name for name in
          archive.namelist() if name.endswith('.dist-info/METADATA'));
          from email.parser import Parser;
          assert Parser().parsestr(archive.read(metadata).decode())['Version'] == __version__"
      - id: evidence
        name: Create local evidence and check release gates
        shell: bash
        run: |
          set +e
          uv run python tools/release_rehearsal.py \
            --root . --artifacts dist --output release-evidence \
            --commit "$(git rev-parse HEAD)"
          status="$?"
          if [ "$status" -eq 0 ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Release rehearsal is BLOCKED; nothing was published."
          fi
      - name: Verify generated checksum manifest before handoff
        run: >-
          uv run python -c "from pathlib import Path; from skillroll.release
          import verify_artifact_manifest; assert not verify_artifact_manifest(
          Path('release-evidence/SHA256SUMS.json').read_bytes(), Path('dist'))"
      - name: Fail blocked publication requests
        if: >-
          steps.evidence.outputs.publishable != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: exit 1
      # actions/upload-artifact v7.0.1
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence
          path: |
            dist
            release-evidence
          if-no-files-found: error

  attest:
    name: Attest release artifacts
    if: >-
      needs.build.outputs.publish == 'true' &&
      needs.build.outputs.publishable == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-evidence
      # actions/attest v4.2.2
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish to PyPI
    if: >-
      needs.build.outputs.publish == 'true' &&
      needs.build.outputs.publishable == 'true'
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-evidence
      # pypa/gh-action-pypi-publish v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist

  github-release:
    name: Create GitHub release
    if: github.event_name != 'release'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout or repository code runs with the write token.
      - name: Publish the exact built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        shell: bash
        run: |
          args=(--verify-tag --target "$RELEASE_COMMIT" --generate-notes)
          if [ -z "${CANDIDATE_RUN:-}" ]; then
            args=(--target "$RELEASE_COMMIT" --generate-notes)
          fi
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
