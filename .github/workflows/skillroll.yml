# Repository workflow: exercise this reviewed candidate, not a released harness.
name: SkillRoll

on:
  pull_request:
  workflow_dispatch:
    inputs:
      reviewed_ref:
        description: Exact reviewed commit SHA or refs/pull/NUMBER/head
        required: true
        type: string
      scope:
        description: What to evaluate
        required: true
        default: all
        type: choice
        options: [all, skill, case]
      selection_path:
        description: Skill or eval-case path for the selected scope
        required: false
        type: string
      samples:
        description: Independent model-backed samples to run (1-10)
        required: false
        default: 1
        type: string
      with_skill_control:
        description: Also run samples without the selected skill for comparison
        required: false
        default: false
        type: boolean
      concurrency:
        description: Maximum simultaneous independent cases (1-16)
        required: false
        default: 4
        type: string
      run_repository_checks:
        description: Run repository-declared commands in a separate secretless job
        required: true
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: >-
    skillroll-${{ github.workflow }}-${{ github.event.pull_request.number ||
    inputs.reviewed_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    outputs:
      selected-case-count: ${{ steps.plan.outputs.selected-case-count }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        uses: ./
        continue-on-error: true
        with:
          mode: plan
          scope: changed
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          impact-policy: .github/skillroll-impact.toml
      - name: Fail when the evaluation plan cannot be computed
        if: always() && steps.plan.outputs.outcome != 'PASS'
        run: exit 1
      - id: validate
        uses: ./
        continue-on-error: true
        with:
          mode: validate
          scope: all
          run-commands: false
          command-notice: true
          fork-notice: ${{ github.event.pull_request.head.repo.fork }}
      - name: Fail when repository validation is unsafe or broken
        if: >-
          always() &&
          steps.validate.outputs.outcome != 'PASS' &&
          steps.validate.outputs.outcome != 'INCOMPLETE'
        run: exit 1

  live-eval:
    if: >-
      needs.validate.outputs.selected-case-count != '0' &&
      vars.SKILLROLL_LIVE_EVAL == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.author_association == 'OWNER'
    needs: validate
    runs-on: ubuntu-latest
    environment: skillroll-eval
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Explain candidate harness execution
        run: echo 'This owner-authored revision runs candidate code with the eval key; review it through the skillroll-eval environment policy.'
      - id: live
        uses: ./
        continue-on-error: true
        env:
          SKILLROLL_API_KEY: ${{ secrets.SKILLROLL_API_KEY }}
        with:
          mode: eval
          scope: changed
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          impact-policy: .github/skillroll-impact.toml
          concurrency: ${{ vars.SKILLROLL_EVAL_CONCURRENCY || '4' }}
          samples: 1
          with-skill-control: false
          run-commands: false
          command-notice: true
          upload-artifact: true
      - name: Fail when live evaluation fails
        if: >-
          always() &&
          steps.live.outputs.outcome != 'PASS' &&
          steps.live.outputs.outcome != 'INCOMPLETE'
        run: exit 1

  trusted-live-eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: skillroll-eval
    steps:
      - name: Check the reviewed revision format
        uses: hagaiw/skillroll@v0.1.2
        with:
          mode: validate-ref
          scope: all
          reviewed-ref: ${{ inputs.reviewed_ref }}
      - name: Explain the trusted run
        run: >-
          echo 'This run evaluates the reviewed revision you entered without
          running repository-declared commands. Enable the separate
          trusted-checks job only after reviewing that exact revision.'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.reviewed_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        env:
          SKILLROLL_API_KEY: ${{ secrets.SKILLROLL_API_KEY }}
        with:
          mode: eval
          scope: ${{ inputs.scope }}
          selection-path: ${{ inputs.selection_path }}
          concurrency: ${{ inputs.concurrency }}
          samples: ${{ inputs.samples }}
          with-skill-control: ${{ inputs.with_skill_control }}
          run-commands: false
          command-notice: true
          upload-artifact: true

  trusted-checks:
    if: github.event_name == 'workflow_dispatch' && inputs.run_repository_checks
    runs-on: ubuntu-latest
    steps:
      - name: Check the reviewed revision format
        uses: hagaiw/skillroll@v0.1.2
        with:
          mode: validate-ref
          scope: all
          reviewed-ref: ${{ inputs.reviewed_ref }}
      - name: Explain the repository-check trust boundary
        run: >-
          echo 'This separate secretless job runs repository-declared commands
          from the reviewed revision. They may change the disposable runner or
          use its network. Continue only after you have reviewed that exact
          revision.'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.reviewed_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          mode: validate
          scope: ${{ inputs.scope }}
          selection-path: ${{ inputs.selection_path }}
          run-commands: true

  release-verify:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: ./
        continue-on-error: true
        with:
          mode: validate
          scope: all
          run-commands: false
          command-notice: true
      - name: Fail when release validation is unsafe or broken
        if: >-
          always() &&
          steps.release.outputs.outcome != 'PASS' &&
          steps.release.outputs.outcome != 'INCOMPLETE'
        run: exit 1
