schema_version = 1
skills_path = "plugins"

[inference]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "SKILLROLL_API_KEY"
default_profile = "blind-live"

[inference.profiles.dogfood]
purpose = "Low-cost checks for the compact built-in dogfood skills."
models = ["openai/gpt-4.1-nano"]

[inference.profiles.blind-live]
purpose = "Stable live evidence for the multi-step blind evaluation collection."
models = ["openai/gpt-5.6-luna-pro"]

[inference.profiles.muse-spark]
purpose = "Cost-effective live evidence for authoring and harness evaluation."
models = ["meta/muse-spark-1.3-contributor"]

[inference.limits]
max_turns = 32
timeout_seconds = 360
max_output_tokens = 8192
